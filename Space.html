html{scroll-behavior:auto}
body{font-family:'Segoe UI', system-ui, sans-serif;background:#fff;color:#1a1a1a;overflow-x:hidden}
#setlist-view{max-width:900px;margin:0 auto;padding:40px 24px}
.sl-title{font-size:48px;font-weight:700;text-align:center;margin-bottom:12px;color:#111}
.sl-subtitle{text-align:center;color:#888;font-size:18px;margin-bottom:40px}
.sl-btn{display:flex;align-items:center;width:100%;padding:18px 24px;margin-bottom:10px;font-size:28px;text-align:left;background:#f5f5f5;border:2px solid #e0e0e0;border-radius:10px;cursor:pointer;font-family:inherit;color:#222;transition:background 0.15s}
.sl-btn:hover,.sl-btn:focus{background:#e8e8e8;border-color:#ccc}
.sl-btn .num{color:#aaa;margin-right:18px;min-width:40px;font-weight:700}
.sl-play-all{display:block;width:100%;padding:18px;margin-top:24px;font-size:24px;font-weight:700;background:#059669;color:white;border:none;border-radius:10px;cursor:pointer;font-family:inherit;text-align:center;transition:background 0.15s}

#song-view{display:none}
#song-content{padding:5vh 5vw;padding-bottom:100vh;word-wrap:break-word;overflow-wrap:break-word}
.song-title-display{font-weight:700;color:#111;margin-bottom:4px}
.song-artist-display{font-weight:400;color:#666;margin-bottom:20px}
.song-meta-display{font-weight:400;color:#888;font-style:italic;margin-bottom:16px}
.section-header{font-weight:700;color:#333;margin-top:12px;margin-bottom:4px}
.section-chorus{padding-left:16px;border-left:5px solid currentColor}
.chord-line{margin-bottom:4px;line-height:1}
.segment{display:inline-block;vertical-align:top}
.chord-text{display:block;font-weight:700;font-style:italic;white-space:pre}
.lyric-text{display:block;white-space:pre;line-height:1.3}
.plain-text{line-height:1.3}
.grid-line{font-weight:700;white-space:pre;line-height:1.6}
.comment-text{font-style:italic;color:#777}
.blank-line{}
#progress-bar{position:fixed;top:0;left:0;height:4px;background:#0099cc;z-index:200;transition:width 0.15s linear}
#controls-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(0,0,0,0.88);color:white;padding:12px 20px;display:flex;align-items:center;gap:10px;font-size:15px;transition:opacity 0.4s,transform 0.4s;flex-wrap:wrap}
#controls-bar.controls-hidden{opacity:0;transform:translateY(100%);pointer-events:none}
#controls-bar button{background:rgba(255,255,255,0.15);color:white;border:none;border-radius:6px;padding:10px 18px;font-size:16px;cursor:pointer;font-weight:600;font-family:inherit;transition:background 0.15s;min-height:44px}

#controls-bar .spacer{flex:1}
#controls-bar .info{font-size:13px;color:#aaa}
#controls-bar .size-label{font-size:13px;color:#aaa;white-space:nowrap}

.hidden{display:none!important}
#countdown-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.85);display:flex;align-items:center;justify-content:center;z-index:300;flex-direction:column}
#countdown-overlay.hidden{display:none!important}
#countdown-num{font-size:180px;font-weight:700;color:white;line-height:1}
#edit-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:250;display:flex;align-items:center;justify-content:center;padding:20px}
#edit-overlay.hidden{display:none!important}
#edit-panel{background:#1e1e1e;color:#eee;border-radius:12px;padding:20px;width:100%;max-width:800px;max-height:90vh;display:flex;flex-direction:column;gap:12px}
.edit-header{display:flex;justify-content:space-between;align-items:center;font-size:20px;font-weight:700}
.edit-close{background:none;border:none;color:#aaa;font-size:28px;cursor:pointer;padding:0 8px}

.edit-controls label{display:flex;align-items:center;gap:6px;font-size:14px;color:#aaa}
.edit-controls input[type=range]{width:100px;accent-color:#3b82f6}
.edit-controls .ev{min-width:28px;color:#eee}
.edit-buttons{display:flex;gap:8px;justify-content:flex-end}
.edit-buttons button{padding:10px 20px;border:none;border-radius:6px;font-size:15px;cursor:pointer;font-weight:600;background:#333;color:#eee}
.edit-save{background:#059669!important;color:white!important}
.edit-reset{background:#b91c1c!important;color:white!important}

const SETTINGS={"setlistName":"Space","lyricSize":25,"chordSize":25,"chordColor":"#0099cc","fontFamily":"'Segoe UI', system-ui, sans-serif","countdownSecs":4};
const DIRECTIVE_ALIASES={t:'title',st:'subtitle',sov:'start_of_verse',eov:'end_of_verse',soc:'start_of_chorus',eoc:'end_of_chorus',sob:'start_of_bridge',eob:'end_of_bridge',sot:'start_of_tab',eot:'end_of_tab',sog:'start_of_grid',eog:'end_of_grid',c:'comment',ci:'comment_italic'};
function parseDirective(line){const m=line.match(/^\{(\w+)(?:\s*:\s*(.*?))?\s*\}$/);return m?{type:m[1].toLowerCase(),value:(m[2]||'').trim()}:null}
function parseChordSegments(line){const segments=[];const re=/\[([^\]]+)\]/g;let li=0,m;while((m=re.exec(line))!==null){if(segments.length>0)segments[segments.length-1].lyric+=line.substring(li,m.index);else if(m.index>0)segments.push({chord:'',lyric:line.substring(0,m.index)});segments.push({chord:m[1],lyric:''});li=m.index+m[0].length}const rem=line.substring(li);if(segments.length>0)segments[segments.length-1].lyric+=rem;else segments.push({chord:'',lyric:rem});return{segments,hasChords:segments.some(s=>s.chord),hasLyrics:segments.some(s=>s.lyric.trim())}}
const CHORD_TOKEN_RE=/^[A-G][#b]?(m|maj|min|dim|aug|sus|add|no|[0-9]|\/[A-G][#b]?|[#b+\-\(\)])*$/;
const SECTION_RE=/^\[?\s*(Verse|Chorus|Bridge|Intro|Outro|Pre[- ]?Chorus|Interlude|Solo|Tab|Instrumental|Refrain|Coda|Hook|Break)\s*\d*\s*\]?\s*$/i;
function isChordToken(t){return CHORD_TOKEN_RE.test(t)}
function isChordOnlyLine(l){const t=l.trim();if(!t||t.includes('|'))return false;const tk=t.split(/\s+/);return tk.length>0&&tk.length<=12&&tk.every(isChordToken)}
function isSectionLabel(l){return SECTION_RE.test(l.trim())}
function convertCOT(text){const lines=text.split('\n'),res=[];for(let i=0;i<lines.length;i++){const t=lines[i].trim();if(isSectionLabel(t)){res.push('{comment: '+t.replace(/[\[\]]/g,'').trim()+'}');continue}if(isChordOnlyLine(t)){const nl=(i+1<lines.length)?lines[i+1]:'';const nt=nl.trim();if(nt&&!isChordOnlyLine(nt)&&!isSectionLabel(nt)){const cp=[];const re=/(\S+)/g;let m;while((m=re.exec(lines[i]))!==null)if(isChordToken(m[1]))cp.push({chord:m[1],pos:m.index});let padded=nl;if(cp.length){const end=cp[cp.length-1].pos+cp[cp.length-1].chord.length;while(padded.length<end)padded+=' '}let cl='';let lp=0;for(const c of cp){cl+=padded.substring(lp,c.pos)+'['+c.chord+']';lp=c.pos}cl+=padded.substring(lp);res.push(cl);i++}else{res.push(lines[i].replace(/(\S+)/g,function(match){return isChordToken(match)?'['+match+']':match}))}continue}res.push(lines[i])}return res.join('\n')}
function detectFormat(text){const lines=text.split('\n');let hasCurly=false,hasInline=false,cot=0;for(const l of lines){const t=l.trim();if(t.startsWith('{')&&t.endsWith('}'))hasCurly=true;if(/\[[A-G][^\]]*\]/.test(t)&&t.replace(/\[[^\]]*\]/g,'').trim().length>0)hasInline=true;if(isChordOnlyLine(t))cot++}if(hasCurly||hasInline)return'chordpro';if(cot>=2)return'chords-over-text';return'plain'}
function parseSong(text){const fmt=detectFormat(text);let proc=text;if(fmt==='chords-over-text')proc=convertCOT(text);const lines=proc.split('\n'),elements=[];let title='',artist='',inChorus=false,inGrid=false;for(const raw of lines){const line=raw.trimEnd(),trimmed=line.trim();if(trimmed.startsWith('#'))continue;if(trimmed.startsWith('{')&&trimmed.endsWith('}')){const dir=parseDirective(trimmed);if(!dir)continue;const dt=DIRECTIVE_ALIASES[dir.type]||dir.type;if(dt==='title'){title=dir.value;elements.push({type:'title',text:dir.value})}else if(dt==='subtitle'||dt==='artist'){artist=dir.value;elements.push({type:'artist',text:dir.value})}else if(dt.startsWith('start_of_')){const st=dt.replace('start_of_','');const label=dir.value||st.charAt(0).toUpperCase()+st.slice(1);inChorus=(st==='chorus');if(st==='grid'||st==='tab')inGrid=true;elements.push({type:'section',text:label,sectionType:st,inChorus})}else if(dt.startsWith('end_of_')){inChorus=false;const et=dt.replace('end_of_','');if(et==='grid'||et==='tab')inGrid=false}else if(dt==='comment'||dt==='comment_italic'){elements.push({type:'comment',text:dir.value,inChorus})}continue}if(trimmed===''){elements.push({type:'blank'});continue}if(inGrid||trimmed.includes('|')){elements.push({type:'grid',text:trimmed.replace(/\[([^\]]+)\]/g,'$1'),inChorus});continue}const p=parseChordSegments(trimmed);elements.push({type:'line',...p,inChorus})}return{elements,title,artist}}
let LS=SETTINGS.lyricSize,CS=SETTINGS.chordSize;const CC=SETTINGS.chordColor;
function renderEl(el){const d=document.createElement('div');switch(el.type){case'title':d.className='song-title-display';d.style.fontSize=Math.round(LS*1.25)+'px';d.textContent=el.text;break;case'artist':d.className='song-artist-display';d.style.fontSize=Math.round(LS*0.65)+'px';d.textContent=el.text;break;case'section':d.className='section-header';d.style.fontSize=Math.round(LS*0.8)+'px';d.textContent=el.text+':';break;case'comment':d.className='comment-text';d.style.fontSize=Math.round(LS*0.7)+'px';d.textContent=el.text;break;case'grid':d.className='chord-line';if(el.inChorus){d.classList.add('section-chorus');d.style.borderColor=CC}d.style.fontFamily="'Consolas','Courier New',monospace";d.style.fontSize=CS+'px';d.style.fontWeight='700';d.style.color=CC;d.style.whiteSpace='pre';d.style.lineHeight='1.6';d.textContent=el.text;break;case'line':d.className='chord-line';if(el.inChorus){d.classList.add('section-chorus');d.style.borderColor=CC}if(!el.hasChords){const p=document.createElement('div');p.className='plain-text';p.style.fontSize=LS+'px';p.textContent=el.segments.map(s=>s.lyric).join('');d.appendChild(p)}else if(!el.hasLyrics){d.style.fontFamily="'Consolas','Courier New',monospace";d.style.fontSize=LS+'px';d.style.whiteSpace='pre';d.style.lineHeight='1.6';for(const seg of el.segments){if(seg.chord){const ch=document.createElement('span');ch.style.color=CC;ch.style.fontWeight='700';ch.textContent=seg.chord;d.appendChild(ch)}if(seg.lyric)d.appendChild(document.createTextNode(seg.lyric))}}else{for(const seg of el.segments){const sp=document.createElement('span');sp.className='segment';const ch=document.createElement('span');ch.className='chord-text';ch.style.fontSize=CS+'px';ch.style.color=CC;ch.style.height=Math.round(CS*1.3)+'px';if(seg.chord){ch.textContent=seg.chord}else{ch.innerHTML='&nbsp;';ch.style.visibility='hidden'}sp.appendChild(ch);if(el.hasLyrics){const ly=document.createElement('span');ly.className='lyric-text';ly.style.fontSize=LS+'px';ly.textContent=seg.lyric||' ';sp.appendChild(ly)}if(seg.chord&&(!seg.lyric||!seg.lyric.trim())){sp.style.paddingRight=Math.round(CS*0.5)+'px'}d.appendChild(sp)}}break;case'blank':d.className='blank-line';d.style.height=Math.round(LS*0.45)+'px';break}return d}
let scrollSpeed=35,isScrolling=false,lastTS=null,currentSongIdx=-1,playAllMode=false,scrollAccum=0;
var currentMarkers=null,markerDuration=0,origSpeed=35,markerVT=0,markerLastTS=null;
var countdownTimer=null,countdownSecs=SETTINGS.countdownSecs||0,countdownActive=false;
var EDIT_KEY='setlist-edits-'+SETTINGS.setlistName.replace(/[^a-zA-Z0-9]/g,'');
function getSongEdits(idx){try{var d=JSON.parse(localStorage.getItem(EDIT_KEY)||'{}');return d[idx]||null}catch(e){return null}}
function saveSongEdits(idx,edits){try{var d=JSON.parse(localStorage.getItem(EDIT_KEY)||'{}');var x=d[idx]||{};for(var k in edits)x[k]=edits[k];d[idx]=x;localStorage.setItem(EDIT_KEY,JSON.stringify(d))}catch(er){}}
function deleteSongEdits(idx){try{var d=JSON.parse(localStorage.getItem(EDIT_KEY)||'{}');delete d[idx];localStorage.setItem(EDIT_KEY,JSON.stringify(d))}catch(e){}}
function getEffectiveSong(idx){var song=SONGS[idx];var edits=getSongEdits(idx);if(!edits)return song;var m={};for(var k in song)m[k]=song[k];for(var k in edits)m[k]=edits[k];return m}
function openEditMode(){if(currentSongIdx<0)return;stopScroll();var song=getEffectiveSong(currentSongIdx);document.getElementById('edit-title').textContent='Edit: '+song.title;document.getElementById('edit-text').value=song.text;document.getElementById('edit-speed').value=song.speed||35;document.getElementById('edit-speed-val').textContent=song.speed||35;document.getElementById('edit-font').value=LS;document.getElementById('edit-font-val').textContent=LS;document.getElementById('edit-overlay').classList.remove('hidden')}
function cancelEditMode(){document.getElementById('edit-overlay').classList.add('hidden')}
function saveEdit(){var edits={text:document.getElementById('edit-text').value,speed:parseInt(document.getElementById('edit-speed').value),lyricSize:parseInt(document.getElementById('edit-font').value)};saveSongEdits(currentSongIdx,edits);document.getElementById('edit-overlay').classList.add('hidden');loadSong(currentSongIdx,false)}
function resetEdit(){if(!confirm('Reset to original?'))return;deleteSongEdits(currentSongIdx);document.getElementById('edit-overlay').classList.add('hidden');loadSong(currentSongIdx,false)}
document.getElementById('edit-speed').oninput=function(){document.getElementById('edit-speed-val').textContent=this.value};
document.getElementById('edit-font').oninput=function(){document.getElementById('edit-font-val').textContent=this.value};
function scrollLoop(ts){if(!isScrolling)return;if(lastTS===null){lastTS=ts;requestAnimationFrame(scrollLoop);return}const dt=ts-lastTS;lastTS=ts;scrollAccum+=scrollSpeed*(dt/1000);const px=Math.floor(scrollAccum);if(px>=1){window.scrollBy(0,px);scrollAccum-=px}updateProgress();const maxScroll=document.body.scrollHeight-window.innerHeight;if(maxScroll>10&&window.scrollY>=maxScroll-2){isScrolling=false;lastTS=null;scrollAccum=0;document.getElementById('btn-play-pause').innerHTML='&#9654; Play';if(playAllMode&&currentSongIdx<SONGS.length-1){setTimeout(()=>loadSong(currentSongIdx+1,true),3000)}return}requestAnimationFrame(scrollLoop)}
function startScroll(){isScrolling=true;document.getElementById('btn-play-pause').innerHTML='&#10074;&#10074; Pause';document.getElementById('controls-bar').classList.add('controls-hidden');if(currentMarkers&&currentMarkers.length>=1){var curPos=window.scrollY;var maxS=document.body.scrollHeight-window.innerHeight;var pts=[{t:0,pos:0}];for(var i=0;i<currentMarkers.length;i++){pts.push({t:currentMarkers[i].t,pos:markerCenterPos(currentMarkers[i].el)})}pts.push({t:markerDuration,pos:maxS});markerVT=0;for(var i=0;i<pts.length-1;i++){if(curPos>=pts[i].pos&&curPos<=pts[i+1].pos){var f=(pts[i+1].pos-pts[i].pos)>0?(curPos-pts[i].pos)/(pts[i+1].pos-pts[i].pos):0;markerVT=pts[i].t+(pts[i+1].t-pts[i].t)*f;break}}markerLastTS=null;requestAnimationFrame(markerLoop)}else{lastTS=null;scrollAccum=0;requestAnimationFrame(scrollLoop)}}
function markerCenterPos(elIdx){var content=document.getElementById('song-content');var el=content.children[elIdx];if(!el)return 0;var viewH=window.innerHeight;var maxS=document.body.scrollHeight-viewH;var rect=el.getBoundingClientRect();var absTop=rect.top+window.scrollY;var pos=absTop+rect.height/2-viewH/2;return Math.max(0,Math.min(pos,maxS))}
function markerLoop(ts){if(!isScrolling)return;if(markerLastTS===null){markerLastTS=ts;requestAnimationFrame(markerLoop);return}var dt=ts-markerLastTS;markerLastTS=ts;var rate=scrollSpeed/origSpeed;markerVT+=dt*rate;var maxS=document.body.scrollHeight-window.innerHeight;if(maxS<=10){isScrolling=false;return}var elapsed=markerVT;if(elapsed>=markerDuration){window.scrollTo(0,maxS);updateProgress();isScrolling=false;markerLastTS=null;document.getElementById('btn-play-pause').innerHTML='&#9654; Play';if(playAllMode&&currentSongIdx<SONGS.length-1){setTimeout(function(){loadSong(currentSongIdx+1,true)},3000)}return}var pts=[{t:0,pos:0}];for(var i=0;i<currentMarkers.length;i++){pts.push({t:currentMarkers[i].t,pos:markerCenterPos(currentMarkers[i].el)})}pts.push({t:markerDuration,pos:maxS});var target=0;for(var i=0;i<pts.length-1;i++){if(elapsed>=pts[i].t&&elapsed<pts[i+1].t){var f=(elapsed-pts[i].t)/(pts[i+1].t-pts[i].t);target=pts[i].pos+(pts[i+1].pos-pts[i].pos)*f;break}}window.scrollTo(0,Math.round(target));updateProgress();requestAnimationFrame(markerLoop)}
function stopScroll(){isScrolling=false;lastTS=null;scrollAccum=0;markerLastTS=null;clearInterval(countdownTimer);countdownTimer=null;countdownActive=false;document.getElementById('countdown-overlay').classList.add('hidden');document.getElementById('btn-play-pause').innerHTML='&#9654; Play'}
function startCountdown(secs,cb){if(secs<=0){cb();return}countdownActive=true;var count=1;var overlay=document.getElementById('countdown-overlay');var numEl=document.getElementById('countdown-num');overlay.classList.remove('hidden');numEl.textContent=count;countdownTimer=setInterval(function(){count++;if(count>secs){clearInterval(countdownTimer);countdownTimer=null;countdownActive=false;overlay.classList.add('hidden');cb()}else{numEl.textContent=count}},1000)}
function toggleScroll(){if(isScrolling||countdownActive){stopScroll()}else{startCountdown(countdownSecs,function(){startScroll()})}}

function changeSize(delta){LS=Math.max(16,Math.min(80,LS+delta));CS=Math.max(12,Math.min(64,CS+Math.round(delta*0.85)));document.getElementById('sizeLabel').textContent=LS+'px';if(currentSongIdx>=0){saveSongEdits(currentSongIdx,{lyricSize:LS});var wasScrolling=isScrolling;var savedSpeed=scrollSpeed;loadSong(currentSongIdx,false);scrollSpeed=savedSpeed;if(wasScrolling)startScroll()}showControls()}
function updateProgress(){const max=document.body.scrollHeight-window.innerHeight;const pct=max>0?(window.scrollY/max*100):0;document.getElementById('progress-bar').style.width=pct+'%'}

function loadSong(idx,autoPlay){currentSongIdx=idx;stopScroll();const song=getEffectiveSong(idx);if(song.lyricSize){LS=song.lyricSize;CS=Math.round(LS*SETTINGS.chordSize/SETTINGS.lyricSize)}else{LS=SETTINGS.lyricSize;CS=SETTINGS.chordSize}scrollSpeed=song.speed||35;origSpeed=scrollSpeed;markerVT=0;if(song.scrollMarkers){currentMarkers=song.scrollMarkers.markers;markerDuration=song.scrollMarkers.duration}else{currentMarkers=null;markerDuration=0}document.getElementById('sizeLabel').textContent=LS+'px';document.getElementById('songInfo').textContent=song.title+' ('+(idx+1)+'/'+SONGS.length+')';const content=document.getElementById('song-content');content.innerHTML='';const parsed=parseSong(song.text);if(!parsed.elements.some(e=>e.type==='title')&&song.title){const ti=document.createElement('div');ti.className='song-title-display';ti.style.fontSize=Math.round(LS*1.25)+'px';ti.textContent=song.title;content.appendChild(ti)}for(const el of parsed.elements)content.appendChild(renderEl(el));document.getElementById('setlist-view').classList.add('hidden');document.getElementById('song-view').classList.remove('hidden');document.getElementById('song-view').style.display='block';window.scrollTo(0,0);updateProgress();document.getElementById('btn-play-pause').innerHTML='&#9654; Play';showControls();if(autoPlay)setTimeout(function(){startCountdown(countdownSecs,function(){startScroll()})},500)}
function backToSetlist(){stopScroll();playAllMode=false;document.getElementById('song-view').classList.add('hidden');document.getElementById('song-view').style.display='none';document.getElementById('setlist-view').classList.remove('hidden');document.getElementById('progress-bar').style.width='0';buildSongList();window.scrollTo(0,0)}
function nextSong(){if(currentSongIdx<SONGS.length-1)loadSong(currentSongIdx+1,false)}
function prevSong(){if(currentSongIdx>0)loadSong(currentSongIdx-1,false)}
function playAll(){playAllMode=true;startCountdown(countdownSecs,function(){loadSong(0,true)})}
var hideTimer=null;
function showControls(){var bar=document.getElementById('controls-bar');bar.classList.remove('controls-hidden');clearTimeout(hideTimer);hideTimer=setTimeout(function(){if(isScrolling)bar.classList.add('controls-hidden')},4000)}
document.addEventListener('mousemove',showControls);
document.addEventListener('touchstart',showControls);
document.addEventListener('dblclick',function(e){if(document.getElementById('song-view').classList.contains('hidden')||!document.getElementById('edit-overlay').classList.contains('hidden'))return;e.preventDefault();toggleScroll()});
var lastTap=0;
document.addEventListener('touchend',function(e){var now=Date.now();if(now-lastTap<350){e.preventDefault();if(!document.getElementById('song-view').classList.contains('hidden')&&document.getElementById('edit-overlay').classList.contains('hidden'))toggleScroll()}lastTap=now});
document.addEventListener('keydown',function(e){if(!document.getElementById('edit-overlay').classList.contains('hidden')){if(e.key==='Escape'){e.preventDefault();cancelEditMode()}return}showControls();if(document.getElementById('song-view').classList.contains('hidden'))return;var k=e.key;if(k===' '||k==='Enter'){e.preventDefault();toggleScroll()}else if(k==='ArrowUp'){e.preventDefault();window.scrollBy(0,-100)}else if(k==='ArrowDown'){e.preventDefault();window.scrollBy(0,100)}else if(k==='ArrowRight'||k==='ArrowLeft'){e.preventDefault();backToSetlist()}else if(k==='Escape'||k==='Backspace'){e.preventDefault();backToSetlist()}else if(k==='+'||k==='='){e.preventDefault();changeSize(4)}else if(k==='-'||k==='_'){e.preventDefault();changeSize(-4)}else if(k==='e'||k==='E'){e.preventDefault();openEditMode()}});
function buildSongList(){var list=document.getElementById('songList');list.innerHTML='';SONGS.forEach(function(s,i){var btn=document.createElement('button');btn.className='sl-btn';var ed=getSongEdits(i)?' \u270e':'';btn.innerHTML='<span class="num">'+(i+1)+'</span>'+s.title+ed;btn.onclick=function(){loadSong(i,false)};list.appendChild(btn)});var pa=document.createElement('button');pa.className='sl-play-all';pa.textContent='\u25b6 Play All';pa.onclick=playAll;list.appendChild(pa)}
function init(){document.getElementById('slTitle').textContent=SETTINGS.setlistName;document.getElementById('slSubtitle').textContent=SONGS.length+' songs';buildSongList()}
